name: Deploy backend (Scaleway)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SCW_REGION: nl-ams
  # Repository *variable* (not secret): e.g. rg.nl-ams.scw.cloud/learn-fair/lesson-plan-editor
  IMAGE: ${{ vars.SCW_REGISTRY_IMAGE }}
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
  SCW_CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Scaleway Container Registry
        run: echo "$SCW_SECRET_KEY" | docker login "rg.${SCW_REGION}.scw.cloud" -u nologin --password-stdin

      - name: Build and push image (frankenphp_prod)
        run: |
          docker build --target frankenphp_prod -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Install Scaleway CLI
        if: env.SCW_CONTAINER_ID != ''
        run: curl -s https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sudo sh

      # Skipped on the very first run (before the container exists). Create the
      # container once against the pushed :latest image, set SCW_CONTAINER_ID,
      # then re-run and this points it at the new immutable SHA tag and redeploys.
      - name: Update image and redeploy container
        if: env.SCW_CONTAINER_ID != ''
        run: |
          scw container container update "$SCW_CONTAINER_ID" \
            registry-image="$IMAGE:$GITHUB_SHA" region="$SCW_REGION"
          scw container container deploy "$SCW_CONTAINER_ID" region="$SCW_REGION"
