version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/app
      - ./ssl:/app/ssl
    environment:
      - APP_ENV=dev
      - APP_DEBUG=1
    networks:
      - lesson-plan-network

  frontend-dev:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ./ssl:/app/ssl
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    networks:
      - lesson-plan-network

networks:
  lesson-plan-network:
    driver: bridge
